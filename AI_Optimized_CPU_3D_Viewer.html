<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI-Optimized CPU Architecture</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:Arial}
#info{position:absolute;z-index:2;left:18px;top:15px;background:#000b;padding:14px 18px;border-radius:10px}
canvas{display:block}
</style>
</head>
<body>
<div id="info"><b>AI-Optimized CPU Architecture</b><br>
Drag = rotate &nbsp; Scroll = zoom<br>
Components: CPU Cores • Cache • ALU • Control Unit • FPU • NPU • AI Optimization Unit
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const scene=new THREE.Scene();
scene.background=new THREE.Color(0.045,0.045,0.055);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1000);
camera.position.set(16,14,18);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x222222,2.2));
const dl=new THREE.DirectionalLight(0xffffff,3); dl.position.set(10,15,10); scene.add(dl);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
new OBJLoader().load('AI_Optimized_CPU.obj',o=>{
  o.rotation.x=-0.15;
  scene.add(o);
},undefined,e=>console.log(e));
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)} animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
